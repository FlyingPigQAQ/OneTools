appId: com.onetools.app
productName: OneTools
copyright: Copyright © 2026

directories:
  buildResources: resources
  output: dist

files:
  - "out/**/*"
  - "!src"
  - "!scripts"
  - "!*.config.ts"
  - "!tsconfig*.json"

extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
    # Only ship the binary that matches the target arch: a notarized build must
    # not contain foreign-arch Mach-O files (and x64/ may be empty).
    filter:
      - "${arch}/**/*"

mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  icon: resources/icon.icns
  gatekeeperAssess: false
  # Identity is resolved at build time:
  #   - locally / in CI with a certificate: electron-builder reads CSC_NAME,
  #     CSC_LINK + CSC_KEY_PASSWORD (see .github/workflows/build-macos.yml).
  #   - without a certificate: CSC_IDENTITY_AUTO_DISCOVERY=false skips signing
  #     entirely, so an unsigned build never fails on a missing identity.
  # Never hardcode a developer name here — it overrides CI values and breaks
  # reproducible builds.
  notarize: true

dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
# zip target uses the default artifactName: ${productName}-${version}-${arch}.zip
# (electron-builder 26 removed the root-level `zip` config block)
