appId: com.onetools.app
productName: OneTools
copyright: Copyright © 2026

directories:
  buildResources: resources
  output: dist

files:
  - "out/**/*"
  - "!src"
  - "!scripts"
  - "!*.config.ts"
  - "!tsconfig*.json"

extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
    # Only ship the binary that matches the target arch: a signed/notarized
    # build must not contain a foreign-arch Mach-O.
    filter:
      - "${arch}/**/*"

mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  icon: resources/icon.icns
  gatekeeperAssess: false
  # The signing identity is NEVER hardcoded here. It is resolved at build time
  # from the environment: CSC_NAME / CSC_LINK / CSC_KEY_PASSWORD / CSC_KEYCHAIN
  # (see .github/workflows/build-macos.yml, which imports the Developer ID
  # certificate into a temporary keychain).
  # Signing is mandatory: release builds pass --config.forceCodeSigning=true,
  # so a missing identity fails the build instead of producing an unsigned app.
  # `notarize: true` submits the .app to Apple's notary service via notarytool
  # using APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER. It is only
  # attempted when CSC_LINK is set (electron-builder imports the .p12 into its
  # own keychain first, which is where the identity used for notarization is
  # looked up).
  notarize: true
  # Fail the build rather than fall back to an unsigned app.
  forceCodeSigning: true

dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
# zip target uses the default artifactName: ${productName}-${version}-${arch}.zip
# (electron-builder 26 removed the root-level `zip` config block)
