# Sign, notarize, and publish OneTools for macOS.
#
# Secrets: MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD,
# APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER
#
# A v* tag, or workflow_dispatch with create_release, publishes a GitHub Release.
# electron-builder imports CSC_LINK into a temporary keychain, signs with
# Hardened Runtime, then notarizes via notarytool (App Store Connect API key).

name: Build macOS

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish artifacts to a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  macos:
    name: Package macOS app
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          [ -f node_modules/electron/path.txt ] || node node_modules/electron/install.js

      - name: Unit tests
        run: npm test

      - name: Fetch static FFmpeg binaries
        run: ./scripts/fetch-ffmpeg-macos.sh

      - name: Build, sign, and notarize
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$APPLE_API_KEY_SECRET" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$APPLE_API_KEY_SECRET" > "$KEY"
          else
            printf '%s' "$APPLE_API_KEY_SECRET" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          APPLE_API_KEY="$KEY" npx electron-builder --mac --universal --publish never

      - name: Verify artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist/mac*/OneTools.app)
          dmg=(dist/*.dmg)
          zip=(dist/*.zip)
          APP="${apps[0]:-}"
          [ -d "$APP" ] || { echo "::error::no packaged .app in dist/"; exit 1; }
          (( ${#dmg[@]} > 0 && ${#zip[@]} > 0 )) || {
            echo "::error::expected dist/*.dmg and dist/*.zip"
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          codesign --verify --verbose=2 "${dmg[0]}"
          xcrun stapler validate "${dmg[0]}"
          for a in $(lipo -archs "$APP/Contents/MacOS/OneTools"); do
            case "$a" in x86_64) dir=x64 ;; *) dir="$a" ;; esac
            test -f "$APP/Contents/Resources/ffmpeg/$dir/ffmpeg"
            test -f "$APP/Contents/Resources/ffmpeg/$dir/ffprobe"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: OneTools-macos-${{ github.run_id }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          name: OneTools ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
