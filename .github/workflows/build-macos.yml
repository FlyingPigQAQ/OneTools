# Build, sign, notarize and publish the OneTools macOS app on GitHub-hosted runners.
#
# Triggers
#   - push of a `v*` tag  -> full signed build + GitHub Release
#   - workflow_dispatch   -> manual run, signed by default (can be turned off)
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   MAC_CSC_LINK                    base64 (.p12, `base64 -i cert.p12`) or an https URL
#                                   of the "Developer ID Application" certificate
#   MAC_CSC_KEY_PASSWORD            password of that .p12
#   KEYCHAIN_PASSWORD               any random string; password of the temporary keychain
#   APPLE_ID                        Apple ID used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD     app-specific password for that Apple ID
#   APPLE_TEAM_ID                   10-char Apple Developer Team ID
#
# Without the secrets above the workflow still builds, but produces an
# UNSIGNED app (it prints a warning instead of failing).

name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign + notarize (needs MAC_* / APPLE_* secrets)'
        type: boolean
        default: true
      create_release:
        description: 'Publish artifacts to a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep the Electron / electron-builder binaries on the fast mirror used by
  # this project (see electron-builder.yml: electronDownload.mirror).
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  macos:
    name: Package macOS app
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Decide whether signing is possible
        id: sign
        env:
          WANT_SIGN: ${{ github.event_name == 'push' && 'true' || inputs.sign }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${MAC_CSC_LINK:-}" ]              || missing="$missing MAC_CSC_LINK"
          [ -n "${MAC_CSC_KEY_PASSWORD:-}" ]      || missing="$missing MAC_CSC_KEY_PASSWORD"
          [ -n "${APPLE_ID:-}" ]                  || missing="$missing APPLE_ID"
          [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || missing="$missing APPLE_APP_SPECIFIC_PASSWORD"
          [ -n "${APPLE_TEAM_ID:-}" ]             || missing="$missing APPLE_TEAM_ID"
          if [ "${WANT_SIGN:-true}" = "true" ] && [ -z "$missing" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            # CSC_NAME + CSC_LINK drive signing; make sure auto-discovery does
            # not short-circuit on the certificate name in electron-builder.yml.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
            echo "Signing + notarization ENABLED."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            # No certificate: skip signing AND notarization entirely instead of
            # failing on a missing identity. electron-builder.yml sets
            # `mac.notarize: true`; the only way to turn it off from the outside
            # is CSC_IDENTITY_AUTO_DISCOVERY=false plus an empty team id, so we
            # also hand electron-builder a generated override config below.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "::warning::Signing disabled — missing secrets:${missing:- (signing turned off manually)}. Building an unsigned app."
            # Generated override config (heredocs cannot be nested inside a
            # YAML block scalar, so the lines are written with printf).
            printf 'mac:\n  identity: null\n  notarize: false\n' > "$RUNNER_TEMP/unsigned-override.yml"
            cat "$RUNNER_TEMP/unsigned-override.yml"
          fi

      - name: Install dependencies
        # `npm ci` also triggers this project's postinstall
        # (electron-builder install-app-deps) and normally installs the Electron binary.
        run: npm ci

      - name: Ensure Electron binary is present
        # npm/pnpm frequently skip electron's postinstall (see README); the
        # electron-vite build needs it for the renderer bundle.
        run: |
          if [ ! -f node_modules/electron/path.txt ]; then
            node node_modules/electron/install.js
          fi
          node -e "console.log('electron', require('electron/package.json').version)"

      - name: Unit tests
        run: npm test

      - name: Prepare FFmpeg binaries
        # The app resolves the binary at Resources/ffmpeg/<process.arch>/ffmpeg,
        # so each .app must ship the binary matching its own architecture.
        # See scripts/fetch-ffmpeg-ci.sh for why a Homebrew ffmpeg does not work here.
        run: |
          set -eux
          chmod +x resources/ffmpeg/*/ffmpeg
          ls -la resources/ffmpeg/*/ffmpeg
          for bin in resources/ffmpeg/*/ffmpeg; do
            echo "== $bin"
            # A non-static binary references Homebrew/Absolute paths -> not notarizable.
            if otool -L "$bin" | tail -n +2 | grep -q '^[[:space:]]*[^[:space:]]*/'; then
              echo "::warning::$bin is dynamically linked ($(otool -L "$bin" | tail -n +2 | wc -l | tr -d ' ') deps). It must be self-contained (static) or signed as a nested binary, otherwise notarization fails."
            fi
          done

      - name: Import signing certificate
        if: steps.sign.outputs.enabled == 'true'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          # macOS runners have no keychain unlocked for codesign, so import the
          # .p12 into a dedicated temporary keychain and tell electron-builder
          # (via CSC_KEYCHAIN) to use it.
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="${KEYCHAIN_PASSWORD:-$(openssl rand -hex 16)}"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          # CSC_LINK accepts base64 or an https URL.
          case "$MAC_CSC_LINK" in
            https://*) curl -fsSL -o "$CERT_PATH" "$MAC_CSC_LINK" ;;
            *)         echo "$MAC_CSC_LINK" | base64 --decode > "$CERT_PATH" ;;
          esac

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Required on macOS 11+ so codesign does not prompt for keychain access.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Prepend to the search list so codesign finds this identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          rm -f "$CERT_PATH"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Verify signing identity
        if: steps.sign.outputs.enabled == 'true'
        id: identity
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning
          # Prefer the Developer ID identity belonging to our team, else any
          # Developer ID Application identity. Parsed in plain grep/awk so that
          # the parentheses inside the team id are not treated as regex groups.
          ALL=$(security find-identity -v -p codesigning \
            | grep -o '"Developer ID Application: [^"]*"' | tr -d '"')
          ID=$(printf '%s\n' "$ALL" | grep -F "($APPLE_TEAM_ID)" | head -1)
          [ -n "$ID" ] || ID=$(printf '%s\n' "$ALL" | head -1)
          if [ -z "$ID" ]; then
            echo "::error::no 'Developer ID Application' identity in the keychain — MAC_CSC_LINK must contain a Developer ID Application certificate, not an Apple Development one."
            exit 1
          fi
          echo "identity=$ID" >> "$GITHUB_OUTPUT"
          echo "Using identity: $ID"

      - name: Build + package macOS app
        # `electron-builder --mac` runs the project's own `build` script first
        # (electron-vite build), then packages and signs.
        # --universal produces one .app/.dmg for both architectures.
        env:
          CSC_LINK: ${{ steps.sign.outputs.enabled == 'true' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ steps.sign.outputs.enabled == 'true' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ steps.sign.outputs.enabled == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ steps.sign.outputs.enabled == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.sign.outputs.enabled == 'true' && secrets.APPLE_TEAM_ID || '' }}
          # Passed to electron-builder.yml via `mac.identity`.
          CSC_NAME: ${{ steps.identity.outputs.identity }}
        run: |
          set -euo pipefail
          ARGS=(--mac --universal --publish never)
          # In the unsigned path, override `mac.identity` / `mac.notarize` from
          # electron-builder.yml (electron-builder deep-merges --config) so the
          # build does not fail on a missing certificate.
          if [ "${{ steps.sign.outputs.enabled }}" != "true" ] && [ -f "$RUNNER_TEMP/unsigned-override.yml" ]; then
            ARGS+=(--config "$RUNNER_TEMP/unsigned-override.yml")
          fi
          npx electron-builder "${ARGS[@]}"

      - name: Verify signature
        if: steps.sign.outputs.enabled == 'true'
        run: |
          set -eux
          APP=$(ls -d dist/mac*/OneTools.app | head -1)
          echo "== verifying $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|Identifier'
          # Every nested Mach-O must be signed correctly or notarization breaks.
          for bin in "$APP"/Contents/Resources/ffmpeg/*/ffmpeg; do
            [ -e "$bin" ] || continue
            echo "== $bin"
            codesign --verify --strict --verbose=2 "$bin"
          done
          echo "== dmg =="
          codesign --verify --verbose=2 dist/*.dmg || true

      - name: Verify notarization
        if: steps.sign.outputs.enabled == 'true'
        run: |
          set -eux
          # The .app was notarized as part of the dmg/zip creation; confirm stapling.
          for f in dist/*.dmg; do
            xcrun stapler validate "$f" && echo "stapled: $f"
          done
          spctl -a -vvv -t install dist/mac*/OneTools.app || true

      - name: Verify artifacts
        run: |
          set -eux
          ls -la dist
          for f in dist/*.dmg dist/*.zip; do
            [ -e "$f" ] || { echo "::error::expected artifact $f was not produced"; exit 1; }
          done
          found=0
          for app in dist/mac*/OneTools.app; do
            [ -d "$app" ] || continue
            found=$((found+1))
            arch=$(lipo -archs "$app/Contents/MacOS/OneTools")
            echo "$app -> $arch"
            for a in $arch; do
              ls -la "$app/Contents/Resources/ffmpeg/$a/ffmpeg"
            done
          done
          [ "$found" -gt 0 ] || { echo "::error::no packaged .app found in dist/"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OneTools-macos-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          name: OneTools ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
