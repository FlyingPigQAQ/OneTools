# Sign, notarize, and publish OneTools for macOS.
#
# Secrets: MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD,
# APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER
#
# Push to a branch: unit tests + electron-vite compile only (~1 min).
# Push to main: also compare package.json version with the latest GitHub
# Release. If it is greater, package a signed + notarized universal .dmg
# and publish it as v<version>.
#
# electron-builder imports CSC_LINK into a temporary keychain, signs with
# Hardened Runtime, then notarizes via notarytool (App Store Connect API key).

name: Build macOS

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  macos:
    name: ${{ github.ref == 'refs/heads/main' && 'Test / maybe package' || 'Test' }}
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          [ -f node_modules/electron/path.txt ] || node node_modules/electron/install.js

      - name: Unit tests
        run: npm test

      - name: Compile app
        # `out/` is gitignored. electron-builder does not run `npm run build`
        # for us — locally that is chained by build:mac / build:mac:universal.
        # CI calls electron-builder directly (to pass --publish never), so the
        # electron-vite compile must be explicit or asar lacks out/main/index.js.
        run: |
          set -euo pipefail
          npm run build
          test -f out/main/index.js
          test -f out/preload/index.js
          test -f out/renderer/index.html

      - name: Check package.json version
        if: github.ref == 'refs/heads/main'
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')

          const current = JSON.parse(fs.readFileSync('package.json', 'utf8')).version

          function parse(v) {
            const m = String(v)
              .replace(/^v/, '')
              .match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/)
            if (!m) return null
            return { core: [Number(m[1]), Number(m[2]), Number(m[3])], pre: m[4] || '' }
          }

          function cmp(a, b) {
            for (let i = 0; i < 3; i++) {
              if (a.core[i] !== b.core[i]) return a.core[i] - b.core[i]
            }
            if (!a.pre && b.pre) return 1
            if (a.pre && !b.pre) return -1
            if (a.pre === b.pre) return 0
            return a.pre < b.pre ? -1 : 1
          }

          const cur = parse(current)
          if (!cur) {
            console.error(`::error::invalid package.json version '${current}'`)
            process.exit(1)
          }

          let releases = []
          try {
            const raw = execFileSync(
              'gh',
              ['release', 'list', '--limit', '100', '--json', 'tagName'],
              { encoding: 'utf8' }
            )
            releases = JSON.parse(raw)
          } catch (err) {
            console.error('::error::failed to list GitHub Releases')
            console.error(err.stderr || err.message)
            process.exit(1)
          }

          const versions = releases.map((r) => parse(r.tagName)).filter(Boolean)
          const latest = versions.sort(cmp).at(-1)
          const latestStr = latest
            ? `${latest.core.join('.')}${latest.pre ? `-${latest.pre}` : ''}`
            : ''
          const shouldRelease = !latest || cmp(cur, latest) > 0

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${current}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${current}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_release=${shouldRelease}\n`)

          if (shouldRelease) {
            console.log(`publishing v${current} (latest release: ${latestStr || 'none'})`)
          } else {
            console.log(
              `::notice::skip release: package.json ${current} is not greater than ${latestStr}`
            )
          }
          EOF

      - name: Cache Electron downloads
        if: steps.version.outputs.should_release == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Fetch static FFmpeg binaries
        if: steps.version.outputs.should_release == 'true'
        run: ./scripts/fetch-ffmpeg-macos.sh

      - name: Build, sign, and notarize
        if: steps.version.outputs.should_release == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$APPLE_API_KEY_SECRET" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$APPLE_API_KEY_SECRET" > "$KEY"
          else
            printf '%s' "$APPLE_API_KEY_SECRET" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          APPLE_API_KEY="$KEY" npx electron-builder --mac --universal --publish never \
            -c.extraMetadata.version="${{ steps.version.outputs.version }}"

      - name: Verify artifacts
        if: steps.version.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist/mac*/OneTools.app)
          dmg=(dist/*.dmg)
          APP="${apps[0]:-}"
          [ -d "$APP" ] || { echo "::error::no packaged .app in dist/"; exit 1; }
          (( ${#dmg[@]} > 0 )) || {
            echo "::error::expected dist/*.dmg"
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          # The DMG is a wrapper around the already-stapled .app.
          # electron-builder leaves it unsigned (dmg.sign defaults to false)
          # because a signed-but-un-notarized DMG fights notary.
          for a in $(lipo -archs "$APP/Contents/MacOS/OneTools"); do
            case "$a" in x86_64) dir=x64 ;; *) dir="$a" ;; esac
            test -f "$APP/Contents/Resources/ffmpeg/$dir/ffmpeg"
            test -f "$APP/Contents/Resources/ffmpeg/$dir/ffprobe"
          done

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.should_release == 'true'
        with:
          name: OneTools-macos-${{ github.run_id }}
          path: |
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
